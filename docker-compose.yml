services:
  postgres:
    image: postgres:16
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: tadka
      POSTGRES_PASSWORD: tadka_local   # local lab only, never a real credential
      POSTGRES_DB: tadka
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tadka -d tadka"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command:
      - "redis-server"
      - "--save"
      - ""
      - "--appendonly"
      - "no"
      - "--maxmemory"
      - "64mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
